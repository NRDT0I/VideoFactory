<style>

<body>
<div id="app"></div>
<script>
/* ===== Подключение локальной нейросети =====
   Если endpoint задан — POST JSON на него, ожидается ответ { "url": "<видео>" }.
   Пустой endpoint = режим заглушки (имитация генерации 2 сек). */
const CONFIG={endpoint:'',timeoutMs:600000};
async function runGeneration(p){
  if(!CONFIG.endpoint){await new Promise(r=>setTimeout(r,2000));return{url:null};}
  const res=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.json();
}

/* ===== Иконки ===== */
const P={home:'M3 11l9-8 9 8M5 10v10h14V10',inbox:'M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5',pen:'M4 20l1-5L16 4l4 4L9 19zM13 7l4 4',
gear:'M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2zM12 8a4 4 0 100 8 4 4 0 000-8z',
search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',plus:'M12 5v14M5 12h14',pc:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 8v8M8 12h8',
list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',ext:'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6',back:'M19 12H5M11 6l-6 6 6 6',
dots:'M5 12h.01M12 12h.01M19 12h.01',user:'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7a3 3 0 100 6 3 3 0 000-6zM6 18c1-3 3-4 6-4s5 1 6 4',
img:'M4 4h16v16H4zM4 16l5-5 4 4 3-3 4 4M9 8h.01',vid:'M3 7h12v10H3zM15 11l6-3v8l-6-3',trash:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',
dl:'M12 4v11M7 10l5 5 5-5M5 20h14',clip:'M20 11l-8 8a5 5 0 01-7-7l8-8a3 3 0 014 4l-8 8a1 1 0 01-2-2l7-7',unclip:'M20 11l-8 8a5 5 0 01-7-7M10 6l2-2a3 3 0 014 4l-2 2M4 4l16 16',
chev:'M6 9l6 6 6-6',check:'M5 12l5 5 9-10',pin:'M12 17v5M9 10.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24V16a1 1 0 001 1h12a1 1 0 001-1v-.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V7a1 1 0 011-1 2 2 0 000-4H8a2 2 0 000 4 1 1 0 011 1z',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',copy:'M9 9h11v11H9zM5 15V4h11',x:'M6 6l12 12M18 6L6 18',play:'M8 5v14l11-7z',up:'M12 19V6M6 11l6-6 6 6',mic:'M9 5v14l-5-4H2V9h2zM15 9l6 6M21 9l-6 6',g:'M20 12a8 8 0 11-3-6M12 12h8',
pen2:'M4 20l1-5L16 4l4 4L9 19z',share:'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6',minus:'M5 12h14',list2:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'};
const ic=(n,x='')=>`<svg viewBox="0 0 24 24" ${x}><path d="${P[n]}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);

/* ===== Состояние ===== */
const CATALOG=['Майк','Джеймс','Элис','Моника','Ким','Лео','Нора','Аян','Тара','Бен','Сара','Рик'];
const mkPresets=()=>{const it=(n,p)=>({id:uid(),name:n,prompt:p});return{id:'root',name:'',items:[],groups:[
{id:uid(),name:'Позитивные',items:[it('smile','soft natural smile, relaxed eyes'),it('laugh','genuine laughter, head slightly tilted back'),it('wink','playful wink, slight smirk')],groups:[]},
{id:uid(),name:'Негативные',items:[it('sadness','quiet sadness, downcast eyes'),it('anger','furrowed brows, tense jaw')],groups:[]},
{id:uid(),name:'Нейтральные',items:[it('surprise','raised eyebrows, mouth slightly open'),it('thinking','thoughtful look, gaze drifting aside')],groups:[]}]}};
const mkEmo=n=>({id:uid(),name:n,gens:[]});
const seed=()=>({view:'home',chars:[
 {id:'c1',name:'Персонаж 1',author:'Никнейм',date:'06.03.26',attached:false,dates:[
  {id:'d1',name:'Свидание 1',backs:[{id:'b1',name:'Бэк 1',emos:['smile','smile','smile','smile'].map(mkEmo)},{id:'b2',name:'Бэк 2',emos:[mkEmo('smile')]}]},
  {id:'d2',name:'Свидание 2',backs:[{id:'b3',name:'Бэк 1',emos:[mkEmo('smile')]},{id:'b4',name:'Бэк 2',emos:[]}]},
  {id:'d3',name:'Свидание 3',backs:[1,2,3,4].map(i=>({id:'x'+i,name:'Бэк '+i,emos:[]}))}]},
 {id:'c2',name:'Персонаж 2',author:'Никнейм',date:'06.03.26',attached:true,dates:[]}],
 selChar:null,selDate:null,selEmo:null,q:'',cq:'',collapsed:{},sel:{},cat:CATALOG.map((n,i)=>({id:'k'+i,name:n,author:'Никнейм',charId:null})),presets:mkPresets(),delMode:null,anim:null,settings:{autoSelect:true,shareFrames:false},setTab:'general',
 draft:{prompt:'',start:null,end:null,audio:false,model:'Kling 2.5',ratio:'4:3',res:'1280:960',dur:5,n:1,libs:[]}});
let S=seed();
try{const j=localStorage.getItem('of-proto');if(j){const o=JSON.parse(j);if(o&&o.chars)S=Object.assign(seed(),o,{draft:Object.assign(seed().draft,o.draft)});}}catch(e){}
S.chars.forEach(c=>c.dates.forEach(d=>d.backs.forEach(b=>b.emos.forEach(e=>e.gens.forEach(g=>{if(g.status==='pending')g.status='error';})))));
S.chars.forEach(c=>{if(c.pinned===undefined)c.pinned=false;if(!S.cat.some(k=>k.charId===c.id))S.cat.unshift({id:uid(),name:c.name,author:c.author,charId:c.id})});S.delMode=null;S.anim=null;
const save=()=>{try{localStorage.setItem('of-proto',JSON.stringify(S))}catch(e){}};
const char=()=>S.chars.find(c=>c.id===S.selChar);
const date=()=>char()?.dates.find(d=>d.id===S.selDate);
const findBack=()=>date()?.backs.find(b=>b.emos.some(e=>e.id===S.selEmo));
const selN=e=>e.gens.filter(g=>S.sel[g.id]).length;
const dateSel=()=>{const r=[];date().backs.forEach(b=>b.emos.forEach(e=>e.gens.forEach((g,i)=>{if(S.sel[g.id])r.push({b,e,g,i})})));return r};
const allG=(n,f)=>{f(n);n.groups.forEach(x=>allG(x,f))};
const gfind=id=>{let r;allG(S.presets,n=>{if(n.id===id)r=n});return r};
const sortedChars=()=>[...S.chars].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
const gopts=()=>{const r=[];const w=(n,path)=>{r.push([n.id,n.id==='root'?'Без группы':path]);n.groups.forEach(g=>w(g,n.id==='root'?g.name:path+' / '+g.name))};w(S.presets,'');return r};
const favs=()=>{const f=[];allG(S.presets,n=>n.items.forEach(p=>{if(p.fav)f.push(p)}));return f};
const fh=()=>S.settings.shareFrames?date():findBack();
const findEmo=()=>{for(const b of date()?.backs||[])for(const e of b.emos)if(e.id===S.selEmo)return e;};
const doneN=e=>e.gens.filter(g=>g.status==='done').length;
const stat=e=>e.gens.some(g=>g.status==='pending')?'Генерация…':doneN(e)?'Готово':'Пусто';
const MODELS={'Kling 2.5':1,'Wan 2.2':1,'LTX Video':1};

/* ===== Рендер ===== */
const rail=()=>`<nav class="rail"><div class="logo">OF</div>
${[['home','home'],['catalog','inbox'],['editor','pen']].map(([v,i])=>`<button class="ri ${S.view===v?'on':''}" data-a="nav" data-v="${v}" aria-label="${v}">${ic(i)}</button>`).join('')}
<div class="sp"></div><button class="ri gear ${S.view==='settings'?'on':''}" aria-label="Настройки" data-a="nav" data-v="settings">${ic('gear')}</button><button class="out" data-a="logout">Выйти</button></nav>`;

const tile=(c,badge,au,a,id,m)=>`<div class="tile"><button class="tl" data-a="${a}" data-id="${id||''}" aria-label="${esc(badge)}"></button>${badge?`<span class="badge">${esc(badge)}</span>`:''}${au?`<span class="au">Автор: ${esc(au)}</span>`:''}${ic('img','style="font-size:60px;color:#8a8a8a"')}${m?`<button class="tm" data-a="${m}" data-id="${id}" aria-label="Меню">${ic('dots')}</button>`:''}</div>`;
const sbox=(k,v)=>`<label class="search">${ic('search')}<input id="${k}" placeholder="Поиск" value="${esc(v)}" data-i="${k}" autocomplete="off"><button class="clr" data-a="clr" data-k="${k}" aria-label="Очистить" ${v?'':'hidden'}>${ic('x')}</button></label>`;

function home(){return `<div class="home"><section><h2>Создать проект</h2><div class="tile newp"><button class="tl" data-a="newChar" aria-label="Новый проект"></button><span class="big">Новый проект</span></div></section>
<section><h2>Последние проекты</h2><div class="recent">${S.chars.slice(0,4).map(c=>tile(0,c.name,c.author,'openChar',c.id)).join('')||'<p class="empty">Проектов пока нет</p>'}</div></section></div>`}

const kname=k=>k.charId?(S.chars.find(c=>c.id===k.charId)?.name||k.name):k.name;
const catRes=()=>{const q=S.cq.toLowerCase();return S.cat.filter(k=>kname(k).toLowerCase().includes(q)).map(k=>tile(0,kname(k),k.author,'openCat',k.id,'mCat')).join('')||'<p class="empty">Ничего не найдено</p>'};
function catalog(){return `<div class="cat">${sbox('cq',S.cq)}<div class="grid" id="res">${catRes()}</div></div>`}

const listRes=()=>{const q=S.q.toLowerCase();return sortedChars().filter(c=>c.name.toLowerCase().includes(q)).map(c=>`<div class="row" style="padding:10px 8px"><button class="row" style="padding:0" data-a="openChar" data-id="${c.id}">${ic('user','class="ava"')}<span class="t"><div class="n">${esc(c.name)}</div><div class="d">${c.date}</div></span></button><button data-a="pin" data-id="${c.id}" aria-label="${c.pinned?'Открепить':'Закрепить'}" title="${c.pinned?'Открепить':'Закрепить'}" style="font-size:22px;color:${c.pinned?'#000':'#888'}">${ic('pin',c.pinned?'style="fill:currentColor"':'')}</button></div>`).join('')||'<p class="empty">Персонажей нет. Создайте первого.</p>'};
function listBody(){return `<div>${sbox('q',S.q)}<div style="display:flex;gap:12px;margin:16px 0"><button class="pill dk" style="flex:1" data-a="newChar">${ic('pc')}Создать нового персонажа</button><button class="pill ol" style="flex:1" data-a="pick">${ic('ext')}Выбрать персонажа</button></div><div id="res">${listRes()}</div></div>`}

function mini(){return `<div class="mini"><div class="search" style="cursor:pointer">${ic('search')}</div><button class="rb dk" data-a="newChar" title="Новый персонаж">${ic('pc')}</button><button class="rb ol" data-a="pick" title="Выбрать персонажа">${ic('ext')}</button>
${sortedChars().map(c=>`<button class="rb av ${c.id===S.selChar?'on':''}" data-a="openChar" data-id="${c.id}" title="${esc(c.name)}">${ic('user')}</button>`).join('')}</div>`}

function p2(){const c=char();return `<div class="p p2"><div class="h"><button class="ic" data-a="closeChar" aria-label="Назад" style="border-radius:0">${ic('back')}</button><input value="${esc(c.name)}" data-i="cname"><button class="ic" data-a="mChar" aria-label="Меню">${ic('dots')}</button></div>
<div class="sub">Автор: ${esc(c.author)}</div>
${c.dates.map(d=>`<button class="row ${d.id===S.selDate?'on':''}" data-a="openDate" data-id="${d.id}">${ic('img','class="thumb"')}<span class="t"><div class="n">${esc(d.name)}</div><div class="d">Кол-во бэков: ${d.backs.length}</div></span></button>`).join('')||'<p class="empty">Свиданий нет.<br>Меню «…» → «Новое свидание»</p>'}</div>`}

function p3(){const d=date(),sel=dateSel().length,dm=S.delMode;return `<div class="p p3"><div class="h" style="padding-left:16px"><input value="${esc(d.name)}" data-i="dname"><button class="ic" data-a="mDate" aria-label="Меню">${ic('dots')}</button></div>
${d.backs.map(b=>{const cl=S.collapsed[b.id],dmode=dm&&dm.bid===b.id;return `<div class="bh"><button class="back ${cl?'cl':''}" data-a="fold" data-id="${b.id}">${ic('chev')}${esc(b.name)}</button><button class="bo" data-a="mBack" data-id="${b.id}" aria-label="Опции бэка">${ic('dots')}</button></div>${cl?'':`
${dmode?`<div class="acts"><button class="pill ol" data-a="delCancel">Отмена</button><button class="pill dk" data-a="delGo">Удалить (${Object.keys(dm.ids).length})</button></div>`:`<div class="acts"><button class="pill dk" data-a="addEmo" data-id="${b.id}">${ic('list')}Добавить эмоции из списка</button><button class="pill ol" data-a="newEmo" data-id="${b.id}">${ic('pen2')}Создать новую эмоцию</button></div>`}
${b.emos.map(e=>{const n=selN(e);return `<button class="row ${e.id===S.selEmo&&!dmode?'on':''}" data-a="openEmo" data-id="${e.id}">${dmode?`<span class="ck2 ${dm.ids[e.id]?'on':''}">${dm.ids[e.id]?ic('check'):''}</span>`:''}${ic('img','class="thumb"')}<span class="t"><div class="n">${esc(e.name)}</div><div class="d dd"><span>${stat(e)}</span>${n?`<span>Выбрано: ${n}</span>`:''}</div></span><span class="vc">${ic('vid')}${doneN(e)}</span></button>`}).join('')}`}`}).join('')}
<div class="exp"><button class="pill dk" data-a="exp" ${sel?'':'disabled'}>Экспортировать (${sel})</button></div></div>`}

const fmt=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');const s=`${p(d.getDate())}.${p(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`,tm=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;return s===fmt0()?`Сегодня, ${tm}`:`${s} ${tm}`};
const fmt0=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}.${p(d.getMonth()+1)}.${String(d.getFullYear()).slice(2)}`};

function genCard(g){const bg=g.start?`background-image:url(${g.start})`:'background-image:linear-gradient(135deg,#6b5b4b,#2c2c2c)';
return `<div class="gen"><button class="ck ${S.sel[g.id]?'on':''}" data-a="pickGen" data-id="${g.id}" aria-label="Выбрать">${S.sel[g.id]?ic('check'):''}</button>
<div class="vid" style="${bg}">${g.status==='pending'?'<div class="spin"></div>':g.status==='error'?'<span>Ошибка генерации</span>':g.url?`<video src="${esc(g.url)}" controls loop></video>`:`<span class="pl">${ic('play')}</span>`}</div>
<div class="tx"><div class="pr">${esc(g.prompt)||'<i style="color:#777">Без промпта</i>'}</div>${g.libs&&g.libs.length?`<div class="lib">Из библиотеки: ${esc(g.libs.join(', '))}</div>`:''}<div class="tags"><b>${g.ratio}</b><b>${g.res}</b><b>${g.dur}s</b><b>${esc(g.model)}</b></div>
<div class="ga"><button data-a="delGen" data-id="${g.id}" aria-label="Удалить">${ic('trash')}</button><button data-a="cpGen" data-id="${g.id}" aria-label="Копировать промпт" title="Копировать промпт">${ic('copy')}</button><button data-a="dlGen" data-id="${g.id}" aria-label="Скачать">${ic('dl')}</button><button data-a="mGen" data-id="${g.id}" aria-label="Ещё">${ic('pc')}</button></div></div></div>`}

function p4(){const e=findEmo(),D=S.draft,F=fh(),nsel=selN(e);
const batches={};e.gens.forEach(g=>(batches[g.batch]=batches[g.batch]||[]).push(g));
const ks=Object.keys(batches).sort((a,b)=>b-a);
const slot=(k,l)=>`<div class="slw ${F[k]?'on':''}"><span class="slb"><button class="sl" data-a="frame" data-k="${k}" style="${F[k]?`background-image:url(${F[k]})`:''}" aria-label="${l}">${F[k]?'':ic('img')}</button>${F[k]?`<button class="x" data-a="clrFrame" data-k="${k}" aria-label="Убрать кадр">×</button>`:''}</span>${l}</div>`;
return `<div class="p p4" style="overflow:hidden"><div class="ph">${esc(findBack().name)} - ${esc(e.name)} <button class="ic" data-a="mEmo" aria-label="Меню эмоции">${ic('dots')}</button></div>${nsel?`<div class="selbar"><button class="sbx" data-a="selClear" aria-label="Снять выбор">${ic('x')}</button><b>Выбрано: ${nsel}</b><span class="sp"></span><button class="sbtn" data-a="selDl">${ic('dl')}Скачать</button><button class="sbtn" data-a="selDel">${ic('trash')}Удалить</button></div>`:''}
<div class="feed">${ks.map(k=>`<div class="gh">${fmt(+k)}</div>${batches[k].map(genCard).join('')}`).join('')||'<p class="empty">Генераций пока нет.<br>Опишите эмоцию внизу и нажмите «Отправить».</p>'}</div>
<div class="comp">${F.start?'':`<div class="hint2"><span>Нет стартового изображения${S.settings.shareFrames?'':' для этого бэка'}.</span><button class="lnk" data-a="frame" data-k="start">Загрузить изображение</button></div>`}<div class="cr"><div class="grp">${slot('start','Старт')}${ic('back','style="transform:rotate(180deg);font-size:20px"')}${slot('end','Конец')}</div>
<div class="slw"><button class="sl" data-a="emoPick">${ic('user')}</button>Эмоции</div><div class="slw ${D.audio?'on':''}"><button class="sl" data-a="audio">${ic(D.audio?'play':'mic')}</button>Аудио</div></div>
<textarea id="pr" placeholder="Промпт эмоции…" data-i="prompt">${esc(D.prompt)}</textarea>
<div class="cb"><select data-i="model" aria-label="Модель">${Object.keys(MODELS).map(m=>`<option ${m===D.model?'selected':''}>${m}</option>`).join('')}</select>
<select data-i="ratio" aria-label="Формат">${[['4:3','1280:960'],['16:9','1280:720'],['9:16','720:1280'],['1:1','960:960']].map(([r,x])=>`<option value="${r}|${x}" ${r===D.ratio?'selected':''}>${r}</option>`).join('')}</select>
<select data-i="dur" aria-label="Длительность">${[3,5,8,10].map(n=>`<option value="${n}" ${n==D.dur?'selected':''}>${n} сек</option>`).join('')}</select>
<select data-i="n" aria-label="Количество">${[1,2,3,4].map(n=>`<option ${n==D.n?'selected':''}>${n}</option>`).join('')}</select>
<button class="send ${D.prompt.trim()?'ok':''}" data-a="send" aria-label="Отправить">${ic('up','style="background:currentColor;border-radius:50%;stroke:#fff;padding:9px"')}</button></div></div></div>`}

function settingsEmo(){const g=(n,dep)=>`<div class="sg">${dep?`<div class="sgh"><input value="${esc(n.name)}" data-i="gn" data-id="${n.id}" aria-label="Название группы"><button class="mini-b" data-a="gaddE" data-id="${n.id}">+ Эмоция</button><button class="mini-b" data-a="gaddG" data-id="${n.id}">+ Подгруппа</button><button class="mini-b" data-a="gdel" data-id="${n.id}" aria-label="Удалить группу">${ic('trash')}</button></div>`:''}${n.items.map(p=>`<div class="si"><input value="${esc(p.name)}" data-i="pn" data-id="${p.id}" aria-label="Название эмоции"><input value="${esc(p.prompt)}" data-i="pp" data-id="${p.id}" placeholder="Промпт эмоции" aria-label="Промпт"><button class="mini-b" data-a="pfav" data-id="${p.id}" aria-label="Избранное" title="Избранное">${ic('star',p.fav?'style="fill:currentColor"':'')}</button><button class="mini-b" data-a="pdel" data-id="${p.id}" aria-label="Удалить эмоцию">${ic('trash')}</button></div>`).join('')}${n.groups.map(x=>g(x,dep+1)).join('')}</div>`;
return `<div><p class="hint">Пресеты эмоций: появляются в списке при добавлении эмоции в бэк и в панели генерации (кнопка «Эмоции»). Промпт пресета подставляется в поле промпта.</p><div class="sbar"><button class="pill dk" data-a="gaddG" data-id="root">Новая группа</button><button class="pill ol" data-a="gaddE" data-id="root">Эмоция без группы</button></div>${favBlock()}${g(S.presets,0)}</div>`}
const favBlock=()=>`<div class="sg" style="background:#f1fae3;border-radius:12px;padding:8px 14px;margin-bottom:12px"><div class="sgh"><b>Избранное</b></div>${favs().map(p=>`<div class="si"><span style="width:160px;font-weight:600">${esc(p.name)}</span><span style="flex:1;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.prompt)}</span><button class="mini-b" data-a="pfav" data-id="${p.id}" aria-label="Убрать из избранного">${ic('star','style="fill:currentColor"')}</button></div>`).join('')||'<p class="hint" style="margin:6px 0">Нажмите ★ у эмоции ниже, чтобы добавить её сюда.</p>'}</div>`
const sw=(k,t,d)=>`<div class="srow"><div><b>${t}</b><div class="hint" style="margin:3px 0 0">${d}</div></div><label class="sw"><input type="checkbox" data-i="setting" data-k="${k}" ${S.settings[k]?'checked':''} aria-label="${t}"><span></span></label></div>`;
const settingsGen=()=>sw('autoSelect','Автовыбор последней генерации','Последняя сгенерированная версия в эмоции сразу отмечается галочкой и попадает в экспорт — выбирать вручную не нужно.')+sw('shareFrames','Одно изображение для всех бэков свидания','Стартовое изображение используется во всех бэках внутри свидания. Между разными свиданиями изображение никогда не переносится.');
function settings(){const t=S.setTab||'general';return `<div class="set"><h2>Настройки</h2><div class="tabs" role="tablist">${[['general','Общие'],['emotions','Эмоции']].map(([k,l])=>`<button role="tab" aria-selected="${t===k}" class="tab ${t===k?'on':''}" data-a="stab" data-v="${k}">${l}</button>`).join('')}</div>${t==='general'?settingsGen():settingsEmo()}</div>`}
function p4Hint(){return `<div class="p p4" style="overflow:hidden"><div class="empty">Выберите эмоцию в списке слева,<br>чтобы увидеть генерации и написать промпт.</div></div>`}
function plPanel(){return `<div class="p pl" data-st="${char()?'mini':'full'}"><div class="plf">${listBody()}</div><div class="plm">${mini()}</div></div>`}
function editor(){return plPanel()+(char()?p2()+(date()?p3()+(findEmo()?p4():p4Hint()):''):'')}
function render(){const keep=document.activeElement;const id=keep&&keep.id,ss=keep&&keep.selectionStart;
const v=S.view==='home'?home():S.view==='catalog'?catalog():S.view==='settings'?settings():editor();
const prevSt=document.querySelector('.pl')?.dataset.st;$app.innerHTML=rail()+`<main class="main">${v}</main>`;
const pl=document.querySelector('.pl');if(pl&&prevSt&&pl.dataset.st!==prevSt){const ns=pl.dataset.st;pl.dataset.st=prevSt;void pl.offsetWidth;pl.dataset.st=ns}
const an=S.anim||[];S.anim=null;const els=an.flatMap(q=>[...document.querySelectorAll(q)]);els.forEach(n=>n.classList.add('cz'));if(els.length){void $app.offsetWidth;els.forEach(n=>n.classList.remove('cz'))}
const prA=document.getElementById('pr');if(prA)fit(prA);
if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(ss,ss)}catch(e){}}}save()}
const $app=document.getElementById('app');

/* ===== Меню / уведомления ===== */
let menuItems=[];
function menu(el,items){closeMenu();menuItems=items;const r=el.getBoundingClientRect();const m=document.createElement('div');m.className='menu';m.id='menu';
m.innerHTML=items.map((it,i)=>it[0]?`<button data-m="${i}">${ic(it[0])}${esc(it[1])}</button>`:`<div class="mh">${esc(it[1])}</div>`).join('');document.body.appendChild(m);
m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-m.offsetHeight-8))+'px';return false}
function presetMenu(el,cb){const it=[],f=favs();if(f.length){it.push([null,'Избранное']);f.forEach(p=>it.push(['star',p.name,()=>cb(p)]))}
const walk=(n,path)=>{if(n.items.length){it.push([null,path||'Без группы']);n.items.forEach(p=>it.push(['user',p.name,()=>cb(p)]))}n.groups.forEach(x=>walk(x,n.id==='root'?x.name:path+' / '+x.name))};walk(S.presets,'');
if(!it.length){toast('Добавьте эмоции в настройках');return false}return menu(el,it)}
const closeMenu=()=>document.getElementById('menu')?.remove();
function toast(t){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2200)}

/* ===== Диалоги ===== */
function closeDlg(id){document.getElementById(id||'dlg')?.remove()}
function dlg(html,id){id=id||'dlg';closeDlg(id);const o=document.createElement('div');o.className='ov';o.id=id;o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(o);return o}
function confirmDlg(title,text,ok,fn,cl){const o=dlg(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="da"><button class="pill ol" data-cancel>${esc(cl||'Отмена')}</button><button class="pill dk danger" data-ok>${esc(ok||'Удалить')}</button></div>`,'dlg2');
 o.querySelector('[data-cancel]').onclick=()=>closeDlg('dlg2');o.querySelector('[data-ok]').onclick=()=>{closeDlg('dlg2');fn()};o.querySelector('[data-cancel]').focus()}
function pickerDlg(bid){const sel=new Set(),groups=[],f=favs();if(f.length)groups.push(['Избранное',f]);
 const w=(n,path)=>{if(n.items.length)groups.push([path||'Без группы',n.items]);n.groups.forEach(g=>w(g,n.id==='root'?g.name:path+' / '+g.name))};w(S.presets,'');
 const o=dlg(`<div class="dh"><h3>Добавить эмоции из списка</h3><button class="bo" data-dm aria-label="Меню">${ic('dots')}</button></div><div class="pbody">${groups.map(([t,its])=>`<div class="mh">${esc(t)}</div>${its.map(p=>`<button class="prow" data-id="${p.id}"><span class="ck2"></span><span>${esc(p.name)}</span></button>`).join('')}`).join('')||'<p class="empty">Список пуст. Добавьте эмоции в настройках.</p>'}</div><div class="da"><button class="pill ol" data-cancel>Отмена</button><button class="pill dk" data-ok disabled>Добавить (0)</button></div>`);
 const ok=o.querySelector('[data-ok]');
 o.querySelector('[data-dm]').onclick=e=>{e.stopPropagation();menu(e.currentTarget,[['gear','Настроить эмоции',()=>{closeDlg();S.view='settings';S.setTab='emotions';render()}]])};
 o.querySelectorAll('.prow').forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(sel.has(id))sel.delete(id);else sel.add(id);const on=sel.has(id);
  o.querySelectorAll(`.prow[data-id="${id}"] .ck2`).forEach(c=>{c.classList.toggle('on',on);c.innerHTML=on?ic('check'):''});ok.disabled=!sel.size;ok.textContent=`Добавить (${sel.size})`});
 o.querySelector('[data-cancel]').onclick=()=>closeDlg();
 ok.onclick=()=>{const all=[];allG(S.presets,n=>n.items.forEach(p=>{if(sel.has(p.id))all.push(p)}));const prev=S.selEmo;closeDlg();all.forEach(p=>addEmo(bid,p.name,p));if(all.length>1)S.selEmo=prev;render()}}
function newEmoDlg(bid){const opts=gopts().map(([id,l])=>`<option value="${id}">${esc(l)}</option>`).join('');
 const o=dlg(`<h3>Новая эмоция</h3><div class="seg"><label><input type="radio" name="gm" value="ex" checked> Добавить в существующую группу</label><label><input type="radio" name="gm" value="new"> Создать подгруппу</label></div>
<div id="gx"><select id="gsel" aria-label="Группа">${opts}</select></div><div id="gn2" hidden><input id="gname" placeholder="Название подгруппы"><select id="gpar" aria-label="Внутри группы">${opts}</select></div>
<input id="en" placeholder="Название эмоции"><textarea id="ep" placeholder="Промпт (необязательно)"></textarea><label class="fv"><input type="checkbox" id="efav"> Добавить в избранное</label>
<div class="da"><button class="pill ol" data-cancel>Отмена</button><button class="pill dk" data-ok disabled>Создать</button></div>`);
 const $=i=>o.querySelector('#'+i),ok=o.querySelector('[data-ok]'),isNew=()=>o.querySelector('[name=gm]:checked').value==='new';
 const dirty=()=>$('en').value.trim()||$('ep').value.trim()||$('gname').value.trim()||$('efav').checked||isNew();
 const upd=()=>{$('gx').hidden=isNew();$('gn2').hidden=!isNew();ok.disabled=!($('en').value.trim()&&(!isNew()||$('gname').value.trim()))};
 o.addEventListener('input',upd);o.addEventListener('change',upd);
 o.querySelector('[data-cancel]').onclick=()=>{if(!dirty())closeDlg();else confirmDlg('Закрыть без сохранения?','Введённые данные будут потеряны.','Закрыть',()=>closeDlg(),'Продолжить')};
 ok.onclick=()=>{let g;if(isNew()){g={id:uid(),name:$('gname').value.trim(),items:[],groups:[]};(gfind($('gpar').value)||S.presets).groups.push(g)}else g=gfind($('gsel').value)||S.presets;
  const pr={id:uid(),name:$('en').value.trim(),prompt:$('ep').value.trim(),fav:$('efav').checked};g.items.push(pr);closeDlg();addEmo(bid,pr.name,pr);render()};
 $('en').focus()}
function fit(t){t.style.height='auto';t.style.height=Math.max(52,Math.min(t.scrollHeight,Math.round(innerHeight*.25)))+'px'}
/* ===== Действия ===== */
function newChar(){const c={id:uid(),name:'Персонаж '+(S.chars.length+1),author:'Никнейм',date:fmt0(),attached:false,dates:[]};S.chars.push(c);S.cat.unshift({id:uid(),name:c.name,author:c.author,charId:c.id});Object.assign(S,{view:'editor',selChar:c.id,selDate:null,selEmo:null})}
function newDate(){const c=char(),d={id:uid(),name:'Свидание '+(c.dates.length+1),backs:[{id:uid(),name:'Бэк 1',emos:[]}]};c.dates.push(d);S.selDate=d.id;S.selEmo=null}
function addEmo(bid,name,p){for(const b of date().backs)if(b.id===bid){const e=mkEmo(name);if(p)e.lib=p.name;b.emos.push(e);S.selEmo=e.id}}
function findGen(id){const e=findEmo();return[e,e.gens.find(g=>g.id===id)]}
function doSend(){const e=findEmo(),D=S.draft,F=fh();if(!D.prompt.trim()&&!F.start){toast('Введите промпт или загрузите изображение');return}
const batch=Date.now(),prompt=D.prompt,libs=D.libs.filter(l=>prompt.includes(l.prompt)).map(l=>l.name),ctx={character:char().name,date:date().name,back:findBack().name,emotion:e.name};
if(S.settings.autoSelect)e.gens.forEach(x=>{if(x.auto){delete S.sel[x.id];x.auto=false}});
D.prompt='';D.libs=[];
for(let i=0;i<D.n;i++){const g={id:uid(),batch,prompt,start:F.start||null,end:F.end||null,audio:D.audio,model:D.model,ratio:D.ratio,res:D.res,dur:D.dur,libs,status:'pending',url:null};
 if(S.settings.autoSelect&&i===D.n-1){g.auto=true;S.sel[g.id]=true}
 e.gens.push(g);
 runGeneration({...ctx,prompt,from_library:libs,model:g.model,ratio:g.ratio,resolution:g.res,duration:g.dur,audio:g.audio,start_frame:g.start,end_frame:g.end})
 .then(r=>{g.status='done';g.url=r.url||null}).catch(err=>{g.status='error';toast('Ошибка: '+err.message)}).finally(render)}
render()}
const safe=s=>String(s).replace(/[\\/:*?"<>|]/g,'_').trim();
/* Экспорт: Свидание / Бэк / Эмоция / файлы. Chrome/Edge — запись в выбранную папку, иначе — скачивание файлов с путём в имени */
async function doExport(){const items=dateSel();if(!items.length)return;const dn=safe(date().name),files=[];
for(const r of items){const base=`${dn}/${safe(r.b.name)}/${safe(r.e.name)}/${safe(r.e.name)}_${r.i+1}`;
files.push({path:base+'.txt',data:`Prompt: ${r.g.prompt}\nModel: ${r.g.model}\nFormat: ${r.g.ratio} ${r.g.res} ${r.g.dur}s\nLibrary: ${(r.g.libs||[]).join(', ')}\n`});
if(r.g.url){try{files.push({path:base+'.mp4',data:await(await fetch(r.g.url)).blob()})}catch(e){toast('Не удалось получить видео: '+base)}}}
if(window.showDirectoryPicker){try{const root=await showDirectoryPicker({mode:'readwrite'});for(const f of files){const ps=f.path.split('/');let d=root;for(const q of ps.slice(0,-1))d=await d.getDirectoryHandle(q,{create:true});const h=await d.getFileHandle(ps[ps.length-1],{create:true});const w=await h.createWritable();await w.write(f.data);await w.close()}toast('Экспортировано файлов: '+files.length);return}catch(e){if(e.name==='AbortError')return}}
for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f.data instanceof Blob?f.data:new Blob([f.data],{type:'text/plain'}));a.download=f.path.replace(/\//g,' - ');a.click();await new Promise(r=>setTimeout(r,200))}
toast('Скачано файлов: '+files.length+' (структура — в названиях)')}
function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};i.click()}

const A={
 nav:d=>{S.view=d.v},logout:()=>toast('Выход (заглушка)'),newChar,pick:()=>{S.view='catalog'},
 clr:d=>{S[d.k]='';setTimeout(()=>document.getElementById(d.k)?.focus())},
 openCat:d=>{const k=S.cat.find(x=>x.id===d.id);if(!k.charId){const c={id:uid(),name:k.name,author:k.author,date:fmt0(),attached:true,dates:[]};S.chars.push(c);k.charId=c.id}Object.assign(S,{view:'editor',selChar:k.charId,selDate:null,selEmo:null,delMode:null})},
 mCat:(d,el)=>{const k=S.cat.find(x=>x.id===d.id);return menu(el,[['ext','Открыть',()=>{A.openCat(d);S.anim=['.p2'];render()}],
  ['pen2','Изменить имя',()=>{const n=prompt('Новое имя',kname(k));if(n&&n.trim()){const c=S.chars.find(x=>x.id===k.charId);if(c)c.name=n.trim();else k.name=n.trim();render()}}],
  ['g','Перейти на Google Drive',()=>toast('Открыть Google Drive (заглушка)')],
  ['trash','Удалить',()=>{confirmDlg('Удалить проект?','«'+kname(k)+'» будет удалён из каталога.','Удалить',()=>{S.cat=S.cat.filter(x=>x!==k);if(k.charId){S.chars=S.chars.filter(c=>c.id!==k.charId);if(S.selChar===k.charId)Object.assign(S,{selChar:null,selDate:null,selEmo:null})}render()})}]])},
 openChar:d=>{Object.assign(S,{view:'editor',selChar:d.id,selDate:null,selEmo:null,delMode:null})},
 closeChar:()=>{Object.assign(S,{selChar:null,selDate:null,selEmo:null,delMode:null})},
 pin:d=>{const c=S.chars.find(x=>x.id===d.id);c.pinned=!c.pinned;toast(c.pinned?'Закреплён — теперь в начале списка':'Откреплён')},
 openDate:d=>{S.selDate=d.id;S.selEmo=null;S.delMode=null},
 openEmo:d=>{if(S.delMode){const i=S.delMode.ids;if(i[d.id])delete i[d.id];else i[d.id]=true;return}S.selEmo=d.id},
 fold:d=>{S.collapsed[d.id]=!S.collapsed[d.id]},
 mChar:(d,el)=>{const c=char();return menu(el,[['plus','Новое свидание',()=>{newDate();render()}],['pin',c.pinned?'Открепить':'Закрепить',()=>{c.pinned=!c.pinned;render()}],['g','Перейти в Google Drive',()=>toast('Открыть Google Drive (заглушка)')],
  ['minus','Убрать из списка',()=>{S.cat.forEach(k=>{if(k.charId===c.id){k.name=c.name;k.charId=null}});S.chars=S.chars.filter(x=>x.id!==c.id);A.closeChar();render()}],
  ['trash','Удалить '+c.name,()=>{confirmDlg('Удалить персонажа?','«'+c.name+'» и все его свидания, бэки и эмоции будут удалены без возможности восстановления.','Удалить',()=>{S.cat=S.cat.filter(k=>k.charId!==c.id);S.chars=S.chars.filter(x=>x.id!==c.id);A.closeChar();render()})}]])},
 mDate:(d,el)=>menu(el,[['plus','Новый бэк',()=>{const dt=date();dt.backs.push({id:uid(),name:'Бэк '+(dt.backs.length+1),emos:[]});render()}],['trash','Удалить '+date().name,()=>{const dt=date();confirmDlg('Удалить свидание?','«'+dt.name+'», все его бэки, эмоции и генерации будут удалены без возможности восстановления.','Удалить',()=>{const c=char();c.dates=c.dates.filter(x=>x!==dt);S.selDate=S.selEmo=null;render()})}]]),
 mBack:(d,el)=>{const b=date().backs.find(x=>x.id===d.id);return menu(el,[['pen2','Переименовать бэк',()=>{const n=prompt('Название бэка',b.name);if(n&&n.trim()){b.name=n.trim();render()}}],
  ['list','Удалить эмоции',()=>{S.delMode={bid:b.id,ids:{}};S.collapsed[b.id]=false;render()}],
  ['trash','Удалить бэк',()=>{confirmDlg('Удалить бэк?','«'+b.name+'» и все его эмоции (генераций: '+b.emos.reduce((a,e)=>a+e.gens.length,0)+') будут удалены.','Удалить',()=>{const dt=date();dt.backs=dt.backs.filter(x=>x!==b);if(b.emos.some(e=>e.id===S.selEmo))S.selEmo=null;render()})}]])},
 delCancel:()=>{S.delMode=null},
 delGo:()=>{const dm=S.delMode,n=Object.keys(dm.ids).length;if(!n){toast('Выберите эмоции');return false}
  confirmDlg('Удалить эмоции?','Будет удалено эмоций: '+n+'. Все их генерации тоже удалятся.','Удалить',()=>{const b=date().backs.find(x=>x.id===dm.bid);b.emos=b.emos.filter(e=>!dm.ids[e.id]);if(dm.ids[S.selEmo])S.selEmo=null;S.delMode=null;render()});return false},
 mEmo:(d,el)=>menu(el,[['pen2','Переименовать',()=>{const e=findEmo(),n=prompt('Название эмоции',e.name);if(n){e.name=n.trim();render()}}],['g','Перейти в Google Drive',()=>toast('Открыть Google Drive (заглушка)')],['share','Поделиться',()=>toast('Ссылка скопирована (заглушка)')],['trash','Удалить эмоцию',()=>{confirmDlg('Удалить эмоцию?','Эмоция и все её генерации будут удалены.','Удалить',()=>{for(const b of date().backs)b.emos=b.emos.filter(e=>e.id!==S.selEmo);S.selEmo=null;render()})}]]),
 addEmo:d=>{pickerDlg(d.id);return false},
 newEmo:d=>{newEmoDlg(d.id);return false},
 pickGen:d=>{S.sel[d.id]=!S.sel[d.id]},
 delGen:d=>{confirmDlg('Удалить генерацию?','Видео и его промпт будут удалены.','Удалить',()=>{const[e]=findGen(d.id);e.gens=e.gens.filter(g=>g.id!==d.id);delete S.sel[d.id];render()});return false},
 cpGen:d=>{const[,g]=findGen(d.id),ok=()=>toast('Промпт скопирован');(navigator.clipboard?navigator.clipboard.writeText(g.prompt):Promise.reject()).then(ok).catch(()=>{const t=document.createElement('textarea');t.value=g.prompt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();ok()});return false},
 dlGen:d=>{const[,g]=findGen(d.id);if(g.url){const a=document.createElement('a');a.href=g.url;a.download='emotion.mp4';a.click()}else toast('Файла нет: подключите нейросеть (CONFIG.endpoint)')},
 mGen:(d,el)=>menu(el,[['up','Повторить с этими параметрами',()=>{const[,g]=findGen(d.id);Object.assign(S.draft,{prompt:g.prompt,model:g.model,ratio:g.ratio,res:g.res,dur:g.dur});const F=fh();F.start=g.start;F.end=g.end;render()}],['img','Взять как стартовый кадр',()=>{const[,g]=findGen(d.id);fh().start=g.start;render()}]]),
 frame:d=>{pickFile(u=>{fh()[d.k]=u;render()});return false},clrFrame:d=>{fh()[d.k]=null},
 emoPick:(d,el)=>presetMenu(el,p=>{S.draft.prompt=p.prompt;S.draft.libs=p.prompt?[{name:p.name,prompt:p.prompt}]:[];render()}),
 audio:()=>{S.draft.audio=!S.draft.audio},send:()=>{doSend();return false},exp:()=>{doExport();return false},
 gaddG:d=>{gfind(d.id).groups.push({id:uid(),name:'Новая группа',items:[],groups:[]})},
 gaddE:d=>{gfind(d.id).items.push({id:uid(),name:'новая эмоция',prompt:''})},
 gdel:d=>{confirmDlg('Удалить группу?','Группа и все эмоции в ней будут удалены.','Удалить',()=>{allG(S.presets,n=>{n.groups=n.groups.filter(x=>x.id!==d.id)});render()});return false},
 selClear:()=>{findEmo().gens.forEach(g=>{delete S.sel[g.id]})},
 selDel:()=>{const e=findEmo(),ids=e.gens.filter(g=>S.sel[g.id]).map(g=>g.id);confirmDlg('Удалить выбранные генерации?','Будет удалено: '+ids.length+'. Это действие нельзя отменить.','Удалить',()=>{e.gens=e.gens.filter(g=>!ids.includes(g.id));ids.forEach(i=>delete S.sel[i]);render()});return false},
 selDl:()=>{const e=findEmo();let miss=0;e.gens.forEach((g,i)=>{if(!S.sel[g.id])return;if(g.url){const a=document.createElement('a');a.href=g.url;a.download=safe(e.name)+'_'+(i+1)+'.mp4';a.click()}else miss++});if(miss)toast('Нет файлов у '+miss+' шт.: подключите нейросеть (CONFIG.endpoint)');return false},
 stab:d=>{S.setTab=d.v},
 pfav:d=>{allG(S.presets,n=>n.items.forEach(p=>{if(p.id===d.id)p.fav=!p.fav}))},
 pdel:d=>{allG(S.presets,n=>{n.items=n.items.filter(p=>p.id!==d.id)})}};

document.addEventListener('click',e=>{
 const m=e.target.closest('[data-m]');if(m){const f=menuItems[+m.dataset.m][2];closeMenu();f();return}
 closeMenu();
 const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 const a=t.dataset.a,f=A[a];if(!f)return;
 if(a==='closeChar'&&char()){document.querySelectorAll('.p2,.p3,.p4').forEach(n=>n.classList.add('cz'));const pl=document.querySelector('.pl');if(pl)pl.dataset.st='full';setTimeout(()=>{f();render()},320);return}
 if(['openChar','openCat','newChar'].includes(a)&&!S.selChar)S.anim=['.p2'];
 if(a==='openDate'&&!S.selDate)S.anim=['.p3','.p4'];
 
 if(f(t.dataset,t)!==false)render()});
function setField(t){const k=t.dataset.i,v=t.value,D=S.draft,id=t.dataset.id;
 if(k==='setting'){S.settings[t.dataset.k]=t.checked;save();return}
 if(k==='cq'||k==='q'){S[k]=v;document.getElementById('res').innerHTML=k==='cq'?catRes():listRes();t.parentElement.querySelector('.clr').hidden=!v;return}
 if(k==='cname')char().name=v;else if(k==='dname')date().name=v;
 else if(k==='gn')gfind(id).name=v;
 else if(k==='pn'||k==='pp')allG(S.presets,n=>n.items.forEach(p=>{if(p.id===id)p[k==='pn'?'name':'prompt']=v}));
 else if(k==='ratio'){[D.ratio,D.res]=v.split('|')}else if(k==='dur'||k==='n')D[k]=+v;else D[k]=v;
 if(k==='prompt'){document.querySelector('.send')?.classList.toggle('ok',!!v.trim());fit(t)}save()}
document.addEventListener('input',e=>{if(e.target.dataset.i&&!/SELECT/.test(e.target.tagName))setField(e.target)});
document.addEventListener('change',e=>{if(e.target.dataset.i){setField(e.target);if(/^(cname|dname)$/.test(e.target.dataset.i))render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();(document.querySelector('#dlg2 [data-cancel]')||document.querySelector('#dlg [data-cancel]'))?.click()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='pr')doSend()});
render();
</script>
