function pickFile(cb){const i=document.createElement('input');i.type='file';i.accept='image/png,image/jpeg';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const src=r.result,im=new Image();
  im.onload=()=>{const W=im.naturalWidth,H=im.naturalHeight,cv=(m,q)=>{const k=Math.min(1,m/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};let u=src,th=src;try{u=cv(1280,.88);th=cv(160,.8)}catch(e){}cb(u,W/H,th,f.name)};
  im.onerror=()=>cb(src,null,src,f.name);im.src=src};r.readAsDataURL(f)};i.click()}
const safe=s=>String(s||'file').replace(/[\\/:*?"<>|]/g,'_');

function runGen(b,g,D){g.status='pending';g.progress=0;g.url=null;g.ts=Date.now();g.ar=g.ratio==='auto'?(D.firstAr||b.ar||4/3):rn(g.ratio);if(g.ratio==='auto')g.res=autoRes(g.ar);
 runGeneration({character:char().name,date:date().name,back:b.name,emotion:g.name,prompt:g.prompt,model:g.model,ratio:g.ratio,aspect_ratio:g.ar,resolution:g.res,duration:g.dur,audio:g.audio,first_frame:D.first,first_frame_name:D.firstName,last_frame:D.last},p=>{g.progress=p;document.querySelectorAll('[data-pg="'+g.id+'"]').forEach(n=>n.textContent=p+'%')})
 .then(r=>{g.status='done';g.url=r.url||null}).catch(e=>{g.status='error';toast('Ошибка: '+e.message)}).finally(render)}
function startGen(b,it,D){const g={id:uid(),name:it.name,prompt:it.prompt,first:D.first!==b.first?D.first:null,model:D.model,ratio:D.ratio,res:D.res,dur:D.dur,audio:!D.mute,firstName:D.firstName||b.firstName||null};b.gens.push(g);runGen(b,g,D)}
function doSend(){const v=!!S.viewer,D=dr(),txt=D.prompt.trim();if(!txt||(!v&&!D.first)){toast(v?'Введите промпт':'Загрузите первый кадр и введите промпт');return}
 if(v){const b=findBack(S.viewer.bid),g=curGen();Object.assign(g,{prompt:txt,model:D.model,ratio:D.ratio,res:D.res,dur:D.dur,audio:!D.mute,first:D.first!==b.first?D.first:null,firstName:D.firstName||g.firstName||null});runGen(b,g,D);D.prompt='';render();return}
 const d=date();let b=d.backs.find(x=>x.id===D.backId)||(D.firstName&&findBackByImg(d,D.firstName))||(D.backName&&d.backs.find(x=>!x.firstName&&sameName(x.name,D.backName)));
 if(!b){let base=D.backName||((d.backs.length+1)+' Бэк'),nn=base,k=2;while(d.backs.some(x=>sameName(x.name,nn)))nn=base+' ('+(k++)+')';b={id:uid(),name:nn,first:D.first,firstName:D.firstName,ar:D.firstAr,last:D.last,cl:false,gens:[]};d.backs.push(b);sortBacks(d)}
 D.backId=b.id;
 const items=(D.multi?txt.split('\n').map(x=>x.trim()).filter(Boolean):[txt]).map(l=>{const m=D.multi&&l.match(/^(.{1,40}?) - ([\s\S]+)$/);return m?{name:m[1],prompt:m[2]}:{name:'',prompt:l}});
 items.forEach(it=>{for(let i=0;i<D.n;i++)startGen(b,it,D)});D.prompt='';render()}

/* ===== Действия ===== */
const resetDraft=()=>{const o=S.draft;S.draft=newDraft({model:o.model,ratio:o.ratio,res:o.res,dur:o.dur,n:o.n,mute:o.mute,multi:o.multi});S.emo=null};
function selectChar(c){S.sel=c.id;S.selDate=(c.dates.find(x=>x.id===c.sd)||c.dates[0]).id;if(!S.tabs.includes(c.id))S.tabs.push(c.id);S.viewer=S.vd=null;resetDraft();go('char');S.reveal=true}
const go=v=>{if(S.view!==v)S.from=S.view;S.view=v};
const A={
 nav:d=>{go(d.v);S.emo=null},logout:()=>toast('Выход (заглушка)'),
 goBack:()=>{S.view=S.from&&S.from!=='char'?S.from:'catalog'},
 newChar:()=>{const c=mkChar('');S.chars.unshift(c);selectChar(c)},
 openChar:d=>{const c=S.chars.find(x=>x.id===d.id);c.ts=Date.now();selectChar(c)},
 openTab:d=>{selectChar(S.chars.find(x=>x.id===d.id))},
 closeTab:d=>{const c=S.chars.find(x=>x.id===d.id);if(c)c.pinned=false;const i=S.tabs.indexOf(d.id);S.tabs=S.tabs.filter(x=>x!==d.id);S.viewer=S.vd=S.emo=null;
  if(S.sel===d.id){const n=S.chars.find(x=>x.id===S.tabs[Math.min(i,S.tabs.length-1)]);if(n&&S.view==='char')selectChar(n);else{S.sel=null;if(S.view==='char')S.view='catalog'}}},
 openDate:d=>{S.selDate=d.id;char().sd=d.id;resetDraft();S.reveal=true},
 newDate:()=>{const c=char(),x={id:uid(),name:'Свидание '+(c.dates.length+1),backs:[]};c.dates.push(x);S.selDate=c.sd=x.id;resetDraft();S.reveal=true},
 mChar:(d,el)=>menu(el,[['pin',char().pinned?'Открепить от панели слева':'Закрепить в панели слева',()=>{const c=char();c.pinned=!c.pinned;render()}],['g','Перейти в Google Drive',driveStub],['img','Изменить превью',()=>pickFile((u,ar,th)=>{const c=char();if(!c)return;c.cover=u;c.coverTh=th;toast('Превью обновлено');render()})],'-',['trash','Удалить '+nm(char()),()=>confirmDlg('Удалить персонажа?','«'+nm(char())+'» и все его свидания и эмоции будут удалены без возможности восстановления.',()=>{const id=S.sel;S.chars=S.chars.filter(c=>c.id!==id);A.closeTab({id});render()})]]),
 mDate:(d,el)=>{const c=char(),x=c.dates.find(z=>z.id===d.id);return menu(el,[['pen','Переименовать',()=>askText('Название свидания',x.name,v=>{x.name=v;render()})],['g','Перейти в Google Drive',driveStub],['dl','Скачать '+x.name,()=>dlMany(x.backs.flatMap(b=>b.gens),x.name)],'-',['trash','Удалить '+x.name,()=>confirmDlg('Удалить свидание?','«'+x.name+'», все его бэки и эмоции будут удалены.',()=>{c.dates=c.dates.filter(z=>z!==x);if(!c.dates.length)c.dates.push({id:uid(),name:'Свидание 1',backs:[]});S.selDate=c.dates[0].id;resetDraft();render()})]])},
 mBack:(d,el)=>{const b=findBack(d.id);return menu(el,[['pen','Переименовать',()=>askText('Название бэка',b.name,v=>{const dt=char().dates.find(x=>x.backs.includes(b));if(dt.backs.some(x=>x!==b&&sameName(x.name,v))){toast('Бэк с таким названием уже есть в этом свидании');return}b.name=v;sortBacks(dt);render()})],['g','Перейти в Google Drive',driveStub],['dl','Скачать '+b.name,()=>dlMany(b.gens,b.name)],'-',['trash','Удалить '+b.name,()=>confirmDlg('Удалить бэк?','«'+b.name+'» и все его эмоции ('+b.gens.length+') будут удалены.',()=>{const dt=date();dt.backs=dt.backs.filter(z=>z!==b);if(S.draft.backId===b.id)S.draft.backId=null;render()})]])},
 fold:d=>{const b=findBack(d.id);b.cl=!b.cl},
 frame:d=>{pickFile((u,ar,th,fn)=>{const D=dr();
  if(d.k==='first'){const bn=imgBase(fn);
   if(!bn){toast('У изображения нет имени. Переименуйте файл и загрузите снова');return}
   D.first=u;D.firstAr=ar;D.firstName=bn;
   if(!S.viewer){const bk=backNameOf(fn),ex=findBackByImg(date(),bn)||date().backs.find(x=>!x.firstName&&sameName(x.name,bk));D.backName=bk;D.backId=ex?ex.id:null;
    if(ex)toast('Бэк «'+ex.name+'» уже есть. Эмоции добавятся в него')}
  }else D[d.k]=u;
  render()});return false},
 clrFrame:d=>{const D=dr();D[d.k]=null;if(d.k==='first'){D.firstAr=null;D.firstName=null;if(!S.viewer){D.backId=null;D.backName=null}}},
 mute:()=>{const D=dr();D.mute=!D.mute},multi:()=>{const D=dr();D.multi=!D.multi},big:()=>{S.big=!S.big},clrPrompt:()=>{dr().prompt=''},
 emoBtn:()=>{S.emo=S.emo?null:[]},emoCancel:()=>{S.emo=null},
 emoTog:d=>{if(S.viewer){S.emo=S.emo.includes(d.id)?[]:[d.id];return}const i=S.emo.indexOf(d.id);if(i<0)S.emo.push(d.id);else S.emo.splice(i,1)},
 emoAdd:()=>{const D=dr(),pk=[];S.presets.forEach(g=>g.items.forEach(p=>{if(S.emo.includes(p.id))pk.push(p)}));
  if(S.viewer){D.prompt=pk.map(p=>p.prompt).join(', ')}else{const ls=pk.map(p=>p.name+' - '+p.prompt).join('\n');D.prompt=D.prompt.trim()?D.prompt.replace(/\s+$/,'')+'\n'+ls:ls;D.multi=true}S.emo=null},
 mEmoDlg:(d,el)=>menu(el,[['gear','Настроить эмоции',()=>{S.emo=null;S.viewer=null;go('settings');render()}]]),
 send:()=>{doSend();return false},
 openGen:d=>{const b=findBack(d.b),g=b.gens.find(x=>x.id===d.id);S.viewer={bid:b.id,gid:g.id};S.vd=newDraft({first:b.first,firstAr:b.ar,firstName:g.firstName||b.firstName||null,model:g.model,ratio:g.ratio,res:g.ratio==='auto'?'auto':g.res,dur:g.dur,mute:!g.audio,multi:false});S.emo=null;phI=0},
 vSel:d=>{S.viewer.gid=d.id},vClose:()=>{S.viewer=S.vd=S.emo=null},vsec:d=>{S.vsec[d.k]=!S.vsec[d.k]},
 vPlay:()=>toast('Видео появится после подключения нейросети (CONFIG.endpoint)'),vShare:()=>{const g=curGen();Object.assign(S.vd,{model:g.model,ratio:g.ratio,res:g.ratio==='auto'?'auto':g.res,dur:g.dur,mute:!g.audio});toast('Настройки генерации перенесены в панель')},vDrive:driveStub,
 vCopy:()=>{const t=curGen().prompt;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Промпт скопирован')).catch(()=>toast('Не удалось скопировать'));return false},
 vDl:()=>{dlMany([curGen()],curGen().name);return false},
 vMore:(d,el)=>menu(el,[['copy','Взять промпт в поле',()=>{S.vd.prompt=curGen().prompt;render()}]]),
 vDel:()=>{confirmDlg('Удалить эмоцию?','Видео и его промпт будут удалены.',()=>{const b=findBack(S.viewer.bid),id=S.viewer.gid;b.gens=b.gens.filter(g=>g.id!==id);if(b.gens.length)S.viewer.gid=b.gens[0].id;else S.viewer=S.vd=null;render()});return false},
 gaddG:()=>{S.presets.push({id:uid(),name:'Новая группа',items:[]})},gaddE:d=>{S.presets.find(g=>g.id===d.id).items.push({id:uid(),name:'новая эмоция',prompt:''})},
 gdel:d=>{confirmDlg('Удалить группу?','Группа и все эмоции в ней будут удалены.',()=>{S.presets=S.presets.filter(g=>g.id!==d.id);render()});return false},
 pdel:d=>{S.presets.forEach(g=>{g.items=g.items.filter(p=>p.id!==d.id)})}};

document.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){const f=menuItems[+m.dataset.m][2];closeMenu();f();return}
 closeMenu();const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f&&f(t.dataset,t)!==false)render()});
function setField(t){const k=t.dataset.i,v=t.value,id=t.dataset.id;
 if(k==='cq'){S.cq=v;document.getElementById('res').innerHTML=catRes();return}
 if(k==='tsz'){S.tsz=+v;document.querySelector('.bk')?.style.setProperty('--ts',v+'px');save();return}
 if(k==='cname')char().name=v;else if(k==='gname')curGen().name=v;else if(k==='gn')S.presets.find(g=>g.id===id).name=v;
 else if(k==='pn'||k==='pp')S.presets.forEach(g=>g.items.forEach(p=>{if(p.id===id)p[k==='pn'?'name':'prompt']=v}));
 else{const D=dr();if(k==='ratio')[D.ratio,D.res]=v.split('|');else if(k==='dur'||k==='n')D[k]=+v;else D[k]=v;
  if(k==='prompt'){document.querySelector('.sd')?.classList.toggle('ok',!!v.trim()&&(!!S.viewer||!!D.first));fit(t)}}save()}
document.addEventListener('input',e=>{if(e.target.dataset.i&&e.target.tagName!=='SELECT')setField(e.target)});
document.addEventListener('change',e=>{if(e.target.dataset.i)setField(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();const c=document.querySelector('#dlg [data-cancel]');if(c)c.click();else if(S.emo){S.emo=null;render()}}
 if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='pr')doSend()});
/* превью: автовоспроизведение при наведении */
const hv=(e,on)=>{const t=e.target.closest?.('.gt.rd');if(!t||t.contains(e.relatedTarget))return;const v=t.querySelector('video');if(!v)return;if(on){v.currentTime=0;const r=v.play&&v.play();if(r&&r.catch)r.catch(()=>{})}else v.pause()};
document.addEventListener('mouseover',e=>hv(e,true));document.addEventListener('mouseout',e=>hv(e,false));
/* тултипы */
document.addEventListener('mouseover',e=>{const n=e.target.closest?.('[data-tip]');if(!n)return;let t=document.getElementById('tip');if(!t){t=document.createElement('div');t.id='tip';t.className='tip';document.body.appendChild(t)}
 const r=n.getBoundingClientRect();t.textContent=n.dataset.tip;t.style.left=(r.right+10)+'px';t.style.top=(r.top+r.height/2)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest?.('[data-tip]'))document.getElementById('tip')?.remove()});
/* колесо мыши прокручивает вкладки свиданий по горизонтали */
document.addEventListener('wheel',e=>{const t=e.target.closest?.('.dates');if(!t||t.scrollWidth<=t.clientWidth)return;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){t.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
/* подсказки в поле генерации (режим редактирования) меняются каждые 5 сек */
setInterval(()=>{if(!S.viewer)return;const p=document.getElementById('pr');if(!p)return;p.classList.add('phf');setTimeout(()=>{phI=(phI+1)%PH.length;const q=document.getElementById('pr');if(q){q.placeholder=PH[phI];q.classList.remove('phf')}},350)},5000);
render();
</script>
</body>
